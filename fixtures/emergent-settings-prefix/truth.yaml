# The prefix is read from configuration at runtime, so it is genuinely not in the
# repository. The correct detector output is no route and one gap -- not "/health".
app:
  name: settings-prefix
  platform: unknown
services:
  - name: backend
    role: api
    language: python
    install_cmd: pip install -r requirements.txt
    dockerfile: null
    routes: []
    env: []
    probes: []
datastores: []
committed_credentials: []
must_not_detect:
  routes: ["/health", "/api/health"]

# Audit findings, written by hand (RFC-0002, Testing).
findings: []
assessments:
  credential.committed: clean
  platform.hardcoded_url: clean
  frontend.secret_in_bundle: not_applicable
  # The health route exists, but its prefix is read from settings at runtime. "No
  # health route found" is not "no health route", so this must not be a finding.
  service.no_health_endpoint: could_not_assess
