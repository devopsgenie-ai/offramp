# A DO block creates tables dynamically. The replay cannot know what it does, so the
# RLS checks give no answer at all -- not a partial one.
app:
  name: booking-desk
  platform: lovable
services:
  - name: web
    role: web
    language: node
    install_cmd: npm ci
    dockerfile: null
    routes: []
    env: []
    probes: []
datastores:
  - name: supabase
    kind: postgres
    consumed_by: [web]
    env_keys: []
committed_credentials: []
findings: []
assessments:
  credential.committed: clean
  frontend.secret_in_bundle: clean
  service.no_health_endpoint: not_applicable
  supabase.rls.disabled: could_not_assess
  supabase.rls.permissive_write: could_not_assess
  supabase.rls.public_read: could_not_assess
